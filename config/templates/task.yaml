# Template: Task
# ==============
#
# Action items, to-dos, reminders, and commitments.
# Imperative statements and things that need to be done.
#
# PRD Reference: Section 7.2
# TDD Reference: Section 3.3 (example template)

name: task
display_name: Task
description: |
  Action items, to-dos, reminders, and commitments.
  Use for capturing things that need to be done, deadlines,
  and action items from meetings or conversations.
enabled: true

triggers:
  patterns:
    - "I need to"
    - "don't forget to"
    - "remind me to"
    - "task:"
    - "todo:"
    - "to-do:"
    - "action item"
    - "need to"
    - "have to"
    - "should"
    - "must"
    - "gotta"
    - "make sure to"
    - "remember to"
    - "follow up on"
    - "schedule"
    - "send"
    - "call"
    - "email"

  indicators:
    - imperative statements
    - action commitments
    - deadlines mentioned
    - responsibility assignments
    - follow-up requirements
    - explicit requests or asks
    - commitment language (will, going to, promised)

fields:
  - name: title
    type: title
    description: Concise action item
    extraction: |
      Extract ONLY the core action item as a brief imperative statement.
      Start with a verb (e.g., "Review quarterly report", "Call John about project").
      Keep it under 10 words. Be specific but concise.
      DO NOT include meta-language like "Create a task called" or "Remind me to".
      DO NOT include priority or deadline information in the title.
      Example: "Create a high-priority task called Get Truck Brakes Fixed due Friday"
        -> Title should be: "Get Truck Brakes Fixed" (NOT the whole sentence)
    required: true
    notion_property: Task

  - name: date_created
    type: date
    description: When this task was captured
    extraction: Use capture metadata timestamp
    required: true
    notion_property: Date Created

  - name: due_date
    type: date
    description: Deadline if mentioned
    extraction: |
      Extract explicit date/time references and CONVERT them to ISO 8601 format (YYYY-MM-DD).
      Use the current date from metadata to calculate actual dates:
      - "tomorrow" -> add 1 day to current date
      - "next Friday" -> find the next Friday after current date
      - "next week" -> add 7 days to current date
      - "end of month" -> last day of current month
      - Specific dates like "January 30" -> "2026-01-30"
      Leave empty (null) if no deadline is mentioned or implied.
      IMPORTANT: Output MUST be in YYYY-MM-DD format, NOT relative text.
    required: false
    notion_property: Due Date

  - name: priority
    type: select
    description: Task priority level
    extraction: |
      Extract priority from explicit mentions and urgency language.
      - High: "high-priority", "high priority", "urgent", "ASAP", "critical",
        "important", "time-sensitive", "blocking", "immediately", "right away"
      - Medium: normal tasks, moderate urgency, standard deadlines, no urgency mentioned
      - Low: "low-priority", "low priority", "when you get a chance", "eventually",
        "nice to have", "backlog", "someday"
      IMPORTANT: If the text contains "high-priority" or "high priority", ALWAYS return "High".
      Default to Medium only if no priority language is present.
    required: false
    default: Medium
    options:
      - High
      - Medium
      - Low
    notion_property: Priority

  - name: context
    type: rich_text
    description: Why, for whom, related project
    extraction: |
      Extract any mentioned context, stakeholders, or project references.
      Include: who it's for, why it matters, related project or initiative,
      any dependencies or prerequisites, relevant background.
      Leave empty if none present.
    required: false
    notion_property: Context

  - name: status
    type: select
    description: Current task status
    extraction: |
      Always set to "Not Started" for new tasks.
      Status will be updated manually as work progresses.
    required: false
    default: Not Started
    options:
      - Not Started
      - In Progress
      - Complete
    notion_property: Status

  - name: tags
    type: multi_select
    description: Topic tags for organization
    extraction: |
      Generate 2-5 relevant topic tags based on content.
      Include: project names, client names, categories (admin, development, writing),
      areas (work, personal, home), people involved.
    required: false
    notion_property: Tags

  - name: transcription
    type: rich_text
    description: Full raw transcript text
    extraction: |
      Copy the COMPLETE original transcript text exactly as provided.
      Do not summarize, edit, or modify the text in any way.
    required: true
    notion_property: Transcription

notion:
  database_id: ${NOTION_VOICE_CAPTURES_DB_ID}

page_body_template: |
  ## Context
  {{ context | default("No additional context provided.") }}

  {% if due_date %}
  ## Due Date
  {{ due_date }}
  {% endif %}

  ## Raw Transcript
  {{ transcript }}

  ---
  *Processed: {{ processed_at }} | Device: {{ device }} | Duration: {{ duration }}s*
