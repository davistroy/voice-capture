# Template: General (Fallback)
# ============================
#
# Fallback template for content that doesn't fit other templates.
# Always enabled and used when classification confidence < 0.7.
#
# PRD Reference: Section 7.6

name: general
display_name: General
description: |
  Fallback template for content that doesn't clearly fit other templates.
  Used when classification confidence is below threshold (0.7) or when
  content is ambiguous or mixed. Preserves all content with basic structure.
enabled: true

triggers:
  # General has minimal triggers since it's the fallback
  # It catches everything that doesn't match other templates with high confidence
  patterns: []

  indicators:
    - mixed content types
    - ambiguous intent
    - general observations
    - miscellaneous notes
    - unclear categorization

fields:
  - name: title
    type: title
    description: Auto-generated from main topic or action
    extraction: |
      Generate a concise, descriptive title (5-10 words).
      Extract the CORE topic or action, not meta-language.
      DO NOT include phrases like "Create a task", "Remind me", "Note to self".
      Example: "Create a task called Get Truck Brakes Fixed" -> "Get Truck Brakes Fixed"
      Example: "I need to research AI trends" -> "Research AI Trends"
      Focus on WHAT the capture is about, not HOW it was stated.
    required: true
    notion_property: Title

  - name: date
    type: date
    description: Capture timestamp
    extraction: Use capture metadata timestamp
    required: true
    notion_property: Date

  - name: duration
    type: number
    description: Recording length in seconds
    extraction: Use capture metadata duration
    required: false
    notion_property: Duration

  - name: device
    type: select
    description: Capture device
    extraction: Use capture metadata device
    required: false
    options:
      - Watch
      - Phone
      - Unknown
    notion_property: Device

  - name: summary
    type: rich_text
    description: LLM-generated 2-3 sentence summary
    extraction: |
      Generate a 2-3 sentence summary of the capture content.
      Cover the main points or themes mentioned.
      Be objective and informative.
    required: true
    notion_property: Summary

  - name: suggested_template
    type: select
    description: LLM's best guess if confidence was close
    extraction: |
      If this was classified as General because confidence was below threshold,
      indicate which template was the closest match.
      Options: Journal, Task, Idea, Research, Product, or None if truly ambiguous.
      Leave as None if the content doesn't fit any category.
    required: false
    default: None
    options:
      - Journal
      - Task
      - Idea
      - Research
      - Product
      - None
    notion_property: Suggested Template

  - name: priority
    type: select
    description: Priority level (preserved from original classification)
    extraction: |
      Extract priority from explicit mentions and urgency language.
      - High: "high-priority", "high priority", "urgent", "ASAP", "critical",
        "important", "time-sensitive", "blocking", "immediately"
      - Medium: normal priority, moderate urgency, no priority mentioned
      - Low: "low-priority", "low priority", "when you get a chance", "eventually",
        "nice to have", "backlog"
      IMPORTANT: If text contains "high-priority" or "high priority", ALWAYS return "High".
      Leave empty (null) if no priority language is present.
    required: false
    options:
      - High
      - Medium
      - Low
    notion_property: Priority

  - name: due_date
    type: date
    description: Deadline if mentioned (preserved from original classification)
    extraction: |
      Extract explicit date/time references and CONVERT them to ISO 8601 format (YYYY-MM-DD).
      Use the current date from metadata to calculate actual dates:
      - "tomorrow" -> add 1 day to current date
      - "next Friday" -> find the next Friday after current date
      - "next week" -> add 7 days to current date
      - "end of month" -> last day of current month
      Leave empty (null) if no deadline is mentioned.
      IMPORTANT: Output MUST be in YYYY-MM-DD format, NOT relative text.
    required: false
    notion_property: Due Date

  - name: tags
    type: multi_select
    description: Topic tags for organization
    extraction: |
      Generate 2-5 relevant topic tags based on content.
      Use broad categories that help with future retrieval.
      Include any identifiable themes, topics, or contexts.
    required: false
    notion_property: Tags

  - name: transcription
    type: rich_text
    description: Full raw transcript text
    extraction: |
      Copy the COMPLETE original transcript text exactly as provided.
      Do not summarize, edit, or modify the text in any way.
    required: true
    notion_property: Transcription

notion:
  database_id: ${NOTION_VOICE_CAPTURES_DB_ID}

page_body_template: |
  ## Summary
  {{ summary | default("No summary provided.") }}

  {% if suggested_template and suggested_template != "None" %}
  ## Classification Note
  This capture was categorized as General, but might also fit as: {{ suggested_template }}
  {% endif %}

  ## Raw Transcript
  {{ transcript }}

  ---
  *Processed: {{ processed_at }} | Device: {{ device }} | Duration: {{ duration }}s*
