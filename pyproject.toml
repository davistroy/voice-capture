[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-capture"
version = "1.0.0"
description = "Voice capture to Notion pipeline - transforms audio recordings into structured Notion pages"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Troy Davis", email = "troy@stratfieldconsulting.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business :: Groupware",
]
keywords = ["voice", "transcription", "notion", "whisper", "productivity"]

# Dependencies are defined here and mirrored in requirements.txt for pip-compile.
# To generate the lock file for reproducible builds:
#   pip-compile requirements.txt -o requirements.lock
# The Docker build uses requirements.lock for production deployments.
dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Async
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    # File watching
    "watchdog>=4.0",
    # Database
    "aiosqlite>=0.19",
    # APIs
    "openai>=1.0",
    "anthropic>=0.18",
    "notion-client>=2.0",
    "python-pushover>=0.4",
    # CLI
    "click>=8.0",
    "rich>=13.0",
    # Template rendering
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
voice-capture = "src.main:main"

[project.urls]
Homepage = "https://github.com/davistroy/voice-capture"
Documentation = "https://github.com/davistroy/voice-capture/blob/main/README.md"
Repository = "https://github.com/davistroy/voice-capture"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
