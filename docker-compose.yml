# Voice Capture to Notion Pipeline - Docker Compose Configuration
#
# Usage:
#   docker-compose up -d          # Start services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop services
#
# Prerequisites:
#   1. Copy .env.example to .env and configure API keys
#   2. Configure rclone with Google Drive (see scripts/rclone/setup.sh)
#   3. Place rclone.conf in ./rclone-config/

version: '3.8'

services:
  # ==========================================================================
  # Voice Capture Processing Service
  # ==========================================================================
  voice-capture:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-capture
    restart: unless-stopped

    # Expose HTTP port for direct uploads (via Tailscale or internal network)
    # Port only exposed if HTTP_ENABLED=true in your .env
    ports:
      - "${HTTP_PORT:-8080}:8080"

    # Environment variables from .env file
    environment:
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - PUSHOVER_API_TOKEN=${PUSHOVER_API_TOKEN}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY}
      # Notion Database IDs
      - NOTION_VOICE_CAPTURES_DB_ID=${NOTION_VOICE_CAPTURES_DB_ID}
      - NOTION_WEEKLY_SUMMARIES_DB_ID=${NOTION_WEEKLY_SUMMARIES_DB_ID}
      # Logging
      - VOICE_CAPTURE_LOG_LEVEL=${VOICE_CAPTURE_LOG_LEVEL:-INFO}
      # Paths (container paths)
      - VOICE_CAPTURE_INBOX_PATH=/app/inbox
      - VOICE_CAPTURE_PROCESSING_PATH=/app/processing
      - VOICE_CAPTURE_FAILED_PATH=/app/failed
      - VOICE_CAPTURE_DB_PATH=/app/data/voice_capture.db
      - VOICE_CAPTURE_LOG_PATH=/app/logs
      # HTTP Upload Server (Phase 5)
      - HTTP_ENABLED=${HTTP_ENABLED:-false}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - HTTP_API_KEY=${HTTP_API_KEY:-}
      - HTTP_MAX_UPLOAD_MB=${HTTP_MAX_UPLOAD_MB:-100}
      - HTTP_REQUEST_TIMEOUT_SECONDS=${HTTP_REQUEST_TIMEOUT_SECONDS:-60}

    volumes:
      # Persistent data storage
      - voice-capture-data:/app/data
      # Configuration (read-only)
      - ./config:/app/config:ro
      # Log files
      - voice-capture-logs:/app/logs
      # Shared inbox directory (populated by rclone service)
      - voice-capture-inbox:/app/inbox
      # Processing directories
      - voice-capture-processing:/app/processing
      - voice-capture-failed:/app/failed

    networks:
      - voice-capture-net

    depends_on:
      - rclone

    # Graceful shutdown
    stop_grace_period: 30s

    # Resource limits (adjust for your system)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================================
  # rclone Sync Service - Google Drive to Local
  # ==========================================================================
  rclone:
    image: rclone/rclone:latest
    container_name: voice-capture-rclone
    restart: unless-stopped

    # Override entrypoint for continuous sync loop
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Starting rclone sync loop...'
        echo 'Sync interval: ${RCLONE_SYNC_INTERVAL:-180} seconds'
        while true; do
          echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Starting sync...\"
          rclone sync gdrive:/VoiceCaptures/inbox /data/inbox \
            --checksum \
            --verbose \
            --log-file=/data/logs/rclone.log \
            --log-level=INFO
          SYNC_RESULT=$?
          if [ $SYNC_RESULT -eq 0 ]; then
            echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Sync completed successfully\"
          else
            echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Sync failed with code: $SYNC_RESULT\"
          fi
          echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Sleeping for ${RCLONE_SYNC_INTERVAL:-180} seconds...\"
          sleep ${RCLONE_SYNC_INTERVAL:-180}
        done
      "

    environment:
      # Sync interval in seconds (default: 3 minutes)
      - RCLONE_SYNC_INTERVAL=${RCLONE_SYNC_INTERVAL:-180}

    volumes:
      # rclone configuration (contains OAuth tokens - read-only for security)
      - ./rclone-config:/config/rclone:ro
      # Inbox directory (shared with voice-capture service)
      - voice-capture-inbox:/data/inbox
      # Logs directory for rclone logs
      - voice-capture-logs:/data/logs

    networks:
      - voice-capture-net

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

# =============================================================================
# Named Volumes for Data Persistence
# =============================================================================
volumes:
  # SQLite database and processing state
  voice-capture-data:
    name: voice-capture-data

  # Application and rclone logs
  voice-capture-logs:
    name: voice-capture-logs

  # Inbox directory - rclone writes here, voice-capture reads
  voice-capture-inbox:
    name: voice-capture-inbox

  # Processing directory - files being processed
  voice-capture-processing:
    name: voice-capture-processing

  # Failed directory - files requiring manual review
  voice-capture-failed:
    name: voice-capture-failed

# =============================================================================
# Network Configuration
# =============================================================================
networks:
  voice-capture-net:
    name: voice-capture-net
    driver: bridge
